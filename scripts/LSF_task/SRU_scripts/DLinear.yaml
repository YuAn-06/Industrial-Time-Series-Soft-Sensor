# configs.yaml

params:
# Data Config
  model: 'DLinear'
  task: 'short_term_forecasting' # type: str, default: short_term_forecasting, help: ['short_term_forecasting', 'soft_sensor']
  data_name: "SRU" # type: str, default: None, help: ['MFP', 'DEB', 'SRU','PPGAS','PTA']
  data_path: './data/SRU/SRU_data.csv' # type: str, default: None, help: Path to the dataset
  target: 'SO2' # type: str, default: None, help: Target variable name
  data_aug: False # type: bool, default: False, help: If use data augmentation for Deb and SRU dataset Augmentation Options #
  use_amp: False # type: bool, default: False, help: If use automatic mixed precision training
  num_workers: 1 # type: int, DataLoader the number of workers
  if_missing: False # type: bool, default: False, help: If exists Missing Data
  missing_rate: 0 # type: float, default: 0, help: Missing data rate [0:0.5]
  use_axliary_var: False # type: bool, default: False, help: If use mode variable for multi_mode dataset


# Model Config
  enc_in: 21  # Dimension of encoder Input
  dec_in: 21  # Dimension of decoder Input
  C_in: 21  # Dimension of Channel Input
  C_out: 1  # Dimension of Channel Output
  seq_len: 48 # type: int, default: 12, help: Sequence Length
  label_len: 48
  pred_len: 6
  dropout: 0.05
  moving_avg: 25
  individual: False

# Train Configs
  batch_size: 64 # 64
  learning_rate: 0.001 # 0.0001
  epoch: 150
  if_valid: True
  patience: 10 # 10
  lradj: 'cosine' # learning rate adjustment strategy: [type1, type2, cosine]


# Test Config
  inverse: True # If the data is scaled, inverse the data to the original scale

# GPU config
  use_cuda: True
  device: "cuda"
  gpu: 0
  seed: 1998
  device_ids: [0]
  use_multi_gpu: False

