params:
  # Paper reproduction: He et al., IEEE Sensors Journal, 2025.
  model: 'PETC_TNet'
  task: 'short_term_forecasting'
  data_name: 'SRU'
  data_path: './data/SRU/SRU_data.csv'
  target: 'SO2'
  data_aug: True
  use_amp: False
  num_workers: 1

  enc_in: 21
  dec_in: 21
  C_in: 21
  C_out: 1
  seq_len: 128
  label_len: 16
  pred_len: 1
  embed: 'TimeF'
  freq: 's'

  # PETC-TNet: paper-reported patch/TCCAN/Transformer settings.
  patch_len: 16
  kernel_size: 2
  tcn_channels: [32, 32, 32]
  reduction_ratio: 3
  channel_attention_heads: 4
  d_model: 32
  n_heads: 8
  e_layers: 1
  d_layers: 1
  d_ff: 128
  dropout: 0.05
  activation: 'gelu'

  batch_size: 64
  learning_rate: 0.005
  epoch: 300
  patience: 10
  lradj: 'cosine'
  use_tensorboard: False

  inverse: True
  use_cuda: True
  device: 'cuda'
  gpu: 0
  seed: 2021
  device_ids: [0]
  use_multi_gpu: False
