params:
  # Data Config
  model: 'STALSTM'
  task: 'soft_sensor'
  data_name: 'MP'
  data_path: './data/MP/MP_data.csv'
  target: '% Silica Concentrate'
  data_aug: False
  use_amp: False
  num_workers: 1

  # Model Config
  enc_in: 22
  dec_in: 22
  C_in: 22
  C_out: 1
  seq_len: 4
  label_len: 4
  pred_len: 1
  embed: 'TimeF'
  freq: 'h'
  SA_dim: 80
  TA_dim: 60

  # Train Config
  batch_size: 64
  learning_rate: 0.001
  epoch: 300
  patience: 10
  lradj: 'cosine'
  weight_decay: 0.0
  use_tensorboard: False

  # Test Config
  inverse: True

  # GPU Config
  use_cuda: True
  device: 'cuda'
  gpu: 0
  seed: 2021
  device_ids: [0]
  use_multi_gpu: False
