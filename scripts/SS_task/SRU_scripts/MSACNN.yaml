# configs.yaml

params:
# Data Config
  model: 'MSACNN'
  task: 'soft_sensor'
  data_name: "SRU"
  data_path: './data/SRU/SRU_data.csv'
  target: 'SO2'

  data_aug: True
  use_amp: False
  num_workers: 1
  if_missing: False
  missing_rate: 0

# Model Config
  enc_in: 20
  dec_in: 20
  C_in: 20
  C_out: 1

  seq_len: 16
  label_len: 16
  pred_len: 1

  d_model: 128
  stride: 1
  activation: 'GELU'

  reduction_ratio: 8

# Train Configs
  batch_size: 32
  learning_rate: 0.001
  epoch: 200

  patience: 10
  lradj: 'cosine'
  weight_decay: 0.0001
  use_tensorboard: False

# Test Config
  inverse: True

# GPU config
  use_cuda: True
  device: "cuda"
  gpu: 0
  seed: 2021
  device_ids: [0]
  use_multi_gpu: False