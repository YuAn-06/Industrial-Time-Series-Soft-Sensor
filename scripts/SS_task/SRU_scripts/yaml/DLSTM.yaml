params:
  # Data Config
  model: 'DLSTM'
  task: 'soft_sensor'
  data_name: 'SRU'
  data_path: './data/SRU/SRU_data.csv'
  target: 'SO2'
  data_aug: True
  use_amp: False
  num_workers: 1

  # Model Config
  enc_in: 20
  dec_in: 20
  C_in: 20
  C_out: 1
  seq_len: 4
  label_len: 4
  pred_len: 6
  embed: 'TimeF'
  freq: 's'
  hidden_dim: 256

  # Train Config
  batch_size: 64
  learning_rate: 0.001
  epoch: 300
  patience: 10
  lradj: 'cosine'
  use_tensorboard: False

  # Test Config
  inverse: True

  # GPU Config
  use_cuda: True
  device: 'cuda'
  gpu: 0
  seed: 2021
  device_ids: [0]
  use_multi_gpu: False
