params:
  # Data Config
  model: 'ARDNN'
  task: 'soft_sensor'
  data_name: 'SRU'
  data_path: './data/SRU/SRU_data.csv'
  target: 'SO2'
  data_aug: True
  use_amp: False
  num_workers: 1
  if_missing: False
  missing_rate: 0

  # Model Config
  enc_in: 20
  dec_in: 20
  C_in: 20
  C_out: 1

  seq_len: 16
  embed: 'TimeF'
  freq: 's'
  factor: 1
  label_len: 16
  pred_len: 1

  n_components: 3
  d_model: 128
  n_heads: 4
  e_layers: 2
  d_layers: 1
  d_ff: 256
  dropout: 0.1
  activation: 'gelu'

  # Train Config
  batch_size: 32
  learning_rate: 0.0005
  weight_decay: 0.00001
  epoch: 300

  patience: 20
  lradj: 'cosine'
  use_tensorboard: False

  # Test Config
  inverse: True

  # GPU Config
  use_cuda: True
  device: 'cuda'
  gpu: 0
  seed: 2021
  device_ids: [0]
  use_multi_gpu: False