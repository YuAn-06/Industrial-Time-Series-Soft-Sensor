# LDCNN.yaml

params:
  # Data Config
  model: 'LDCNN'
  task: 'soft_sensor'
  data_name: "PPGAS"
  data_path: './data/PPGAS/gt_2011.csv'
  target: 'NOX'

  data_aug: False
  use_amp: False
  num_workers: 1
  if_missing: False
  missing_rate: 0

  # Model Config
  enc_in: 9
  dec_in: 9
  C_in: 9
  C_out: 1

  seq_len: 16
  label_len: 16
  pred_len: 1

  embed: 'TimeF'
  freq: 's'
  factor: 1

  # LDCNN Config
  d_model: 64
  e_layers: 4
  dropout: 0.05

  # Kept for framework compatibility
  n_components: 5
  n_heads: 8
  d_layers: 1
  d_ff: 128
  activation: 'gelu'

  # Train Config
  batch_size: 64
  learning_rate: 0.0005
  epoch: 300
  patience: 10
  lradj: 'cosine'
  use_tensorboard: False

  # Test Config
  inverse: True

  # GPU Config
  use_cuda: True
  device: "cuda"
  gpu: 0
  seed: 2021
  device_ids: [0]
  use_multi_gpu: False