params:
  # Data Config
  model: 'ARDNN'
  task: 'soft_sensor'
  data_name: 'DC'
  data_path: './data/DC/debutanizer_column.csv'
  target: 'y_1'
  data_aug: True
  use_amp: False
  num_workers: 1
  

  # Model Config
  enc_in: 13
  dec_in: 13
  C_in: 13
  C_out: 1
  seq_len: 16
  embed: 'TimeF'
  freq: 's'
  label_len: 16
  pred_len: 1
  d_model: 64
  e_layers: 1

  # Train Config
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
  epoch: 300
  
  patience: 10
  lradj: 'cosine'
  use_tensorboard: False

  # Test Config
  inverse: True

  # GPU Config
  use_cuda: True
  device: 'cuda'
  gpu: 0
  seed: 2021
  device_ids: [0]
  use_multi_gpu: False
