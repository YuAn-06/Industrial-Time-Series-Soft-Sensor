# LDCNN.yaml

params:
  # Data Config
  model: 'LDCNN'
  task: 'soft_sensor'   # ['short_term_forecasting', 'soft_sensor']
  data_name: "DC"
  data_path: './data/DC/debutanizer_column.csv'
  target: 'y_1'

  data_aug: True
  use_amp: False
  num_workers: 1

  # Model Config
  enc_in: 13
  dec_in: 13
  C_in: 13
  C_out: 1

  seq_len: 16
  label_len: 16
  pred_len: 1

  embed: 'TimeF'
  freq: 's'

  # LDCNN-specific / shared model parameters
  d_model: 128
  e_layers: 4       # LDCNN 中对应空洞卷积块数量，建议 <= 4
  dropout: 0.2

  # The following params are kept for framework compatibility

  # Train Config
  batch_size: 64
  learning_rate: 0.0005
  epoch: 300
  patience: 10
  lradj: 'cosine'
  use_tensorboard: False

  # Test Config
  inverse: True

  # GPU Config
  use_cuda: True
  device: "cuda"
  gpu: 0
  seed: 2021
  device_ids: [0]
  use_multi_gpu: False
