# configs.yaml

params:
# Data Config
  model: 'VRNN'
  task: 'soft_sensor' # type: str, default: short_term_forecasting, help: ['short_term_forecasting', 'soft_sensor']
  data_name: "DC" # type: str, default: None, help: ['MFP', 'DEB', 'SRU','PPGAS','PTA']
  data_path: './data/DC/debutanizer_column.csv' # type: str, default: None, help: Path to the dataset
  target: 'y_1' # type: str, default: None, help: Target variable name
  data_aug: True # type: bool, default: False, help: If use data augmentation for Deb and SRU dataset Augmentation Options #
  use_amp: False # type: bool, default: False, help: If use automatic mixed precision training
  num_workers: 1 # type: int, DataLoader the number of workers
   # type: bool, default: False, help: If use mode variable for multi_mode dataset

# Model Config
  enc_in: 13  # type: int, default: 17
  dec_in: 13  # Dimension of decoder Input
  C_in: 13  # Dimension of Channel Input
  C_out: 1  # Dimension of Channel Output
  seq_len: 32 #
  embed: 'TimeF'
  freq: 's'
  label_len: 32
  pred_len: 1    # type: int, default: 6, help: Prediction Length, used for the future prediction feature
  d_model: 32
  x_embed_dim: 16 # type: int, Embedding dimension of X
  z_embed_dim: 16 # type: int, Embedding dimension of Z 
  z_dim: 16       # type: int, Embedding dimension of X
  activation: 'GELU'


# Train Config
  batch_size: 64 #128
  learning_rate: 0.001 # 0.0005
  epoch: 300
  patience: 10 # 25
  lradj: 'cosine' # learning rate adjustment strategy: [type1, type2, cosine]
  use_tensorboard: False

# Test Config
  inverse: True # If the data is scaled, inverse the data to the original scale

# GPU config
  use_cuda: True
  device: "cuda"
  gpu: 0
  seed: 2021
  device_ids: [0]
  use_multi_gpu: False

