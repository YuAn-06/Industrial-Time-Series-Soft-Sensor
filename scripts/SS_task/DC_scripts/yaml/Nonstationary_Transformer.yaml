params:
  # Data Config
  model: 'Nonstationary_Transformer'
  task: 'soft_sensor'
  data_name: 'DC'
  data_path: './data/DC/debutanizer_column.csv'
  target: 'y_1'
  data_aug: False
  use_amp: False
  num_workers: 1
  

  # Model Config
  enc_in: 7
  dec_in: 7
  C_in: 7
  C_out: 1
  seq_len: 16
  label_len: 1
  pred_len: 1

  embed: 'TimeF'
  freq: 's'
  factor: 1

  d_model: 64
  n_heads: 4
  e_layers: 1
  d_layers: 1
  d_ff: 128
  dropout: 0.05
  activation: 'gelu'

  # Nonstationary Transformer specific
  p_hidden_dims: [128, 128]
  p_hidden_layers: 2

  # Train Config
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
  epoch: 300
  
  patience: 10
  lradj: 'cosine'
  use_tensorboard: False

  # Test Config
  inverse: True

  # GPU Config
  use_cuda: True
  device: 'cuda'
  gpu: 0
  seed: 2021
  device_ids: [0]
  use_multi_gpu: False
