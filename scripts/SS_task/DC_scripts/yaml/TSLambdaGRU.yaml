params:
  model: 'TSLambdaGRU'
  task: 'soft_sensor'
  data_name: 'DC'
  data_path: './data/DC/debutanizer_column.csv'
  target: 'y_1'
  data_aug: True
  use_amp: False
  num_workers: 1

  enc_in: 13
  dec_in: 13
  C_in: 13
  C_out: 1
  seq_len: 16
  label_len: 16
  pred_len: 6
  hidden_dim: 64
  e_layers: 3
  lambda1: 0.9
  lambda2: 0.9
  dropout: 0.7

  batch_size: 256
  learning_rate: 0.001
  epoch: 300
  patience: 10
  lradj: 'cosine'
  weight_decay: 0.0
  use_tensorboard: False
  inverse: True

  use_cuda: True
  device: 'cuda'
  gpu: 0
  seed: 2021
  device_ids: [0]
  use_multi_gpu: False
