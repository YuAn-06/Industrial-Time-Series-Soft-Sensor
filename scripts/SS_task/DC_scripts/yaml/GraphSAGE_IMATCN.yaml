# configs.yaml

params:
# Data Config
  model: 'GraphSAGE_IMATCN'
  task: 'soft_sensor'
  data_name: "DC"
  data_path: './data/DC/debutanizer_column.csv'
  target: 'y_1'
  data_aug: True
  use_amp: False
  num_workers: 1


# Model Config
  enc_in: 13
  dec_in: 13
  C_in: 13
  C_out: 1
  seq_len: 128
  label_len: 128
  pred_len: 1
  num_channels: [64,64]
  kernel_size: 2
  d_model: 64
  n_heads: 8
  dropout: 0.05
  graph_build_method: 'mi'
  graph_threshold: 0.4
  graph_sample_size: 64
  weight_decay: 0.0001


# Train Config
  batch_size: 64
  learning_rate: 0.001
  epoch: 300
  patience: 10
  lradj: 'cosine'
  use_tensorboard: False


# Test Config
  inverse: True


# GPU Config
  use_cuda: True
  device: "cuda"
  gpu: 0
  seed: 2021
  device_ids: [0]
  use_multi_gpu: False
