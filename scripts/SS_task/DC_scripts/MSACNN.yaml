# configs.yaml

params:
# Data Config
  model: 'MSACNN'
  task: 'soft_sensor' # type: str, default: short_term_forecasting, help: ['short_term_forecasting', 'soft_sensor']
  data_name: "DC" # type: str, default: None, help: ['MFP', 'DEB', 'SRU','PPGAS','PTA']
  data_path: './data/DC/debutanizer_column.csv' # type: str, default: None, help: Path to the dataset
  target: 'y_1' # type: str, default: None, help: Target variable name
  if_scale: True # type: bool, default: False, help: If scale the data
  data_aug: False # type: bool, default: False, help: If use data augmentation for Deb and SRU dataset Augmentation Options #
  use_amp: False # type: bool, default: False, help: If use automatic mixed precision training
  num_workers: 1 # type: int, DataLoader the number of workers
  if_missing: False # type: bool, default: False, help: If exists Missing Data
  missing_rate: 0 # type: float, default: 0, help: Missing data rate [0:0.5]
  use_axliary_var: False # type: bool, default: False, help: If use mode variable for multi_mode dataset


# Model Config
  enc_in: 13  # Dimension of encoder Input
  dec_in: 13  # Dimension of decoder Input
  C_in: 13  # Dimension of Channel Input
  C_out: 1  # Dimension of Channel Output
  seq_len: 72 # type: int, default: 12, help: Sequence Length
  d_model: 16
  stride: 1
  activation: 'GELU'
  reduction_ratio: 32 #8

# Train Configs
  batch_size: 32 #128
  learning_rate: 0.0001 # 0.0005
  epoch: 400
  if_adj_lr: False
  if_valid: True
  patience: 20 # 25
  lradj: 'cosine' # learning rate adjustment strategy: [type1, type2, cosine]
  annealing_steps: 20
  weight_decay: 0.0001


# Test Config
  inverse: True # If the data is scaled, inverse the data to the original scale

# GPU config
  use_cuda: True
  device: "cuda"
  gpu: 0
  seed: 2021
  device_ids: [0]
  use_multi_gpu: False

